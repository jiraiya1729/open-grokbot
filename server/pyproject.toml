[project]
name = "open-grokbot-server"
version = "0.4.0"
description = "Local-first Open-GrokBot control plane and agent runtime"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.15,<2",
  "boto3>=1.37,<2",
  "pgvector>=0.3,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "inngest>=0.5,<1",
  "langgraph>=0.3,<1",
  "langgraph-checkpoint-postgres>=2.0,<3",
  "psycopg[binary,pool]>=3.2,<4",
  "pydantic-settings>=2.8,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
  "croniter>=6.2.4",
  "pytz>=2026.3.post1",
  "cryptography>=50.0.1",
]

[dependency-groups]
dev = [
  "boto3-stubs[bedrock-runtime]>=1.37,<2",
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["integration: requires PostgreSQL"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
strict = true
exclude = ["alembic"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
